name: 🧹 Cluster Cleanup (Panic Button)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '⚠️ TYPE "CONFIRM-CLEANUP" to proceed'
        required: true
        default: ''
      target:
        description: 'What to clean?'
        default: 'pihole'
        type: choice
        options: 
          - 'all'
          - 'pihole'
          - 'metallb'
          - 'homebridge'
          - 'tailscale'
          - 'cups'
          - 'longhorn'
          - 'traefik'

jobs:
  cleanup:
    runs-on: self-hosted

    steps:
      - name: 🚨 SAFETY CHECK
        if: inputs.confirm != 'CONFIRM-CLEANUP'
        run: |
          echo "❌ ABORTED: You must type 'CONFIRM-CLEANUP'!"
          exit 1

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: 🧹 Execute Cleanup
        shell: bash
        run: |
          TARGET="${{ inputs.target }}"
          echo "🔥 STARTING CLEANUP: $TARGET"

          ###############################################
          # SAFE SERVICE CLEANUP (PVCs PRESERVED)
          ###############################################
          cleanup_services() {
            NS=$1

            echo "🧹 Cleaning services in namespace: $NS"

            # Delete Deployments and Jobs
            kubectl delete deploy --all -n $NS --ignore-not-found=true || true
            kubectl delete job --all -n $NS --ignore-not-found=true || true

            # Clean Service finalizers
            for svc in $(kubectl get svc -n $NS -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo "🧹 Cleaning Service: $svc"
              kubectl get svc $svc -n $NS -o json \
                | jq 'del(.metadata.finalizers)' \
                | kubectl replace --raw "/api/v1/namespaces/$NS/services/$svc/finalize" -f - || true
            done

            # Delete Services normally
            kubectl delete svc --all -n $NS --ignore-not-found=true || true

            echo "✅ Services cleaned in namespace: $NS (PVCs preserved)"
          }

          ###############################################
          # FULL NAMESPACE DELETE (DANGEROUS)
          ###############################################
          force_delete_ns() {
            NS=$1

            if ! kubectl get ns $NS >/dev/null 2>&1; then
              echo "✅ Namespace $NS already gone."
              return
            fi

            echo "⏳ Deleting namespace $NS..."
            kubectl delete ns $NS --wait=false || true

            echo "🧨 Deleting all resources inside $NS..."
            kubectl delete all --all -n $NS --force --grace-period=0 || true
            kubectl delete pvc --all -n $NS --force --grace-period=0 || true

            echo "🧨 Deleting LoadBalancer Services finalizers..."
            for svc in $(kubectl get svc -n $NS -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              kubectl get svc $svc -n $NS -o json \
                | jq 'del(.metadata.finalizers)' \
                | kubectl replace --raw "/api/v1/namespaces/$NS/services/$svc/finalize" -f - || true
            done

            echo "🔨 Removing namespace finalizers..."
            kubectl get ns $NS -o json \
              | jq 'del(.spec.finalizers)' \
              | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - || true

            echo "⏳ Waiting for namespace to disappear..."
            for i in {1..10}; do
              if kubectl get ns $NS >/dev/null 2>&1; then
                sleep 2
              else
                echo "✅ Namespace $NS removed."
                break
              fi
            done
          }

          ###############################################
          # TARGET SELECTION
          ###############################################
          case "$TARGET" in

            "pihole")
              echo "🧹 Cleaning Pi-hole Stack..."
              helmfile destroy --selector name=pihole-stack || true
              cleanup_services "pihole"
              ;;

            "homebridge")
              echo "🧹 Cleaning Homebridge Stack..."
              helmfile destroy --selector name=homebridge || true
              cleanup_services "homebridge"
              ;;

            "tailscale")
              echo "🧹 Cleaning Tailscale Stack..."
              helmfile destroy --selector name=tailscale || true
              cleanup_services "tailscale"
              ;;

            "cups")
              echo "🧹 Cleaning CUPS Print Server..."
              helmfile destroy --selector name=cups || true
              cleanup_services "printing" 
              ;;

            "traefik")
              echo "🧹 Cleaning Traefik and Ingresses..."
              helmfile destroy --selector name=traefik || true
              helmfile destroy --selector name=central-ingresses || true
              force_delete_ns "traefik-system"
              ;;

            "metallb")
              echo "🧹 Cleaning MetalLB..."
              helmfile destroy --selector name=metallb || true
              helmfile destroy --selector name=metallb-config || true
              force_delete_ns "metallb-system"
              ;;

            "longhorn")
              echo "⚠️ Cleaning Longhorn..."
              helmfile destroy --selector name=longhorn || true
              force_delete_ns "longhorn-system"
              ;;

            "all")
              echo "💥 DESTROYING EVERYTHING..."
              helmfile destroy || true
              for ns in pihole traefik-system metallb-system longhorn-system homebridge tailscale printing; do
                force_delete_ns $ns
              done
              ;;
          esac

          ###############################################
          # FINAL CLEANUP
          ###############################################
          echo "🗑️ Pruning global orphans..."
          kubectl delete pod --field-selector=status.phase==Failed -A --ignore-not-found=true
          kubectl delete pod --field-selector=status.phase==Succeeded -A --ignore-not-found=true

          echo "✅ CLEANUP COMPLETED!"
