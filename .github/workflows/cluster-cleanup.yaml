name: 🧹 Cluster Cleanup (Panic Button)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '⚠️ TYPE "CONFIRM-CLEANUP" to proceed'
        required: true
        default: ''
      target:
        description: 'What to clean?'
        default: 'pihole'
        type: choice
        options: 
          - 'all'
          - 'pihole'
          - 'metallb'
          - 'longhorn'
          - 'traefik'

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: 🚨 SAFETY CHECK
        if: inputs.confirm != 'CONFIRM-CLEANUP'
        run: |
          echo "❌ ABORTED: You must type 'CONFIRM-CLEANUP'!"
          exit 1

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: 🧹 Execute Cleanup
        run: |
          TARGET="${{ inputs.target }}"
          echo "🔥 STARTING CLEANUP: $TARGET"

          # Función para forzar borrado de Namespace
          force_delete_ns() {
            NS=$1
            if kubectl get ns $NS > /dev/null 2>&1; then
              echo "⏳ Deleting namespace $NS..."
              # Intentar borrado normal
              kubectl delete ns $NS --timeout=30s --wait=false || true
              
              # Eliminar recursos bloqueantes
              kubectl delete all --all -n $NS --force --grace-period=0 || true
              kubectl delete pvc --all -n $NS --force --grace-period=0 || true
              
              # PATCH FINALIZERS (La magia)
              echo "🔨 Patching finalizers for $NS..."
              kubectl get ns $NS -o json | \
                jq '.spec.finalizers=[]' | \
                kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - || true
            else
              echo "✅ Namespace $NS already gone."
            fi
          }

          case "$TARGET" in
            "pihole")
              echo "🧹 Cleaning Pi-hole Stack..."
              # Usa el nombre correcto del release en helmfile
              helmfile destroy --selector name=pihole-stack || true
              force_delete_ns "pihole"
              ;;

            "traefik")
               echo "🧹 Cleaning Traefik..."
               helmfile destroy --selector name=traefik || true
               force_delete_ns "traefik-system"
               ;;

            "metallb")
              echo "🧹 Cleaning MetalLB..."
              helmfile destroy --selector name=metallb || true
              helmfile destroy --selector name=metallb-config || true
              force_delete_ns "metallb-system"
              ;;

            "longhorn")
              echo "⚠️ Cleaning Longhorn (DANGER)..."
              # Longhorn requiere desinstalación limpia primero
              helmfile destroy --selector name=longhorn || true
              # Script oficial de limpieza Longhorn si falla (opcional)
              # curl -sSfL https://raw.githubusercontent.com/longhorn/longhorn/master/uninstall/uninstall.sh | bash || true
              force_delete_ns "longhorn-system"
              ;;

            "all")
              echo "💥 DESTROYING EVERYTHING..."
              helmfile destroy || true
              # Lista de namespaces a purgar
              for ns in pihole traefik-system metallb-system longhorn-system homebridge tailscale; do
                force_delete_ns $ns
              done
              ;;
          esac

          echo "🗑️ Pruning global orphans..."
          kubectl delete pod --field-selector=status.phase==Failed -A --ignore-not-found=true
          kubectl delete pod --field-selector=status.phase==Succeeded -A --ignore-not-found=true
          
          echo "✅ CLEANUP COMPLETED!"
