name: 🧹 Cluster Cleanup (Panic Button)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '⚠️ TYPE "CONFIRM-CLEANUP" to proceed'
        required: true
        default: ''
      target:
        description: 'What to clean?'
        default: 'pihole'
        type: choice
        options: 
          - 'all'
          - 'pihole'
          - 'metallb'
          - 'longhorn'
          - 'traefik'

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: 🚨 SAFETY CHECK
        if: inputs.confirm != 'CONFIRM-CLEANUP'
        run: |
          echo "❌ ABORTED: You must type 'CONFIRM-CLEANUP'!"
          exit 1

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: 🧹 Execute Cleanup
        run: |
          TARGET="${{ inputs.target }}"
          echo "🔥 STARTING CLEANUP: $TARGET"

          clean_ns() {
            NS=$1
            if kubectl get ns $NS > /dev/null 2>&1; then
              echo "Deleting namespace $NS..."
              kubectl delete ns $NS --timeout=60s || {
                echo "⚠️ Namespace stuck? Removing finalizers..."
                kubectl get ns $NS -o json | jq '.spec.finalizers=[]' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f -
              }
            fi
          }

          case "$TARGET" in
            "all")
              echo "💥 DESTROYING EVERYTHING (Except System)..."
              helmfile destroy --all || true
              
              kubectl get ns --no-headers -o custom-columns=:metadata.name | \
                grep -vE 'kube-system|default|kube-public|kube-node-lease' | \
                xargs -r kubectl delete ns --force --grace-period=0
              ;;

            "pihole")
              echo "🧹 Cleaning Pi-hole & Unbound..."
              helmfile --selector name=pihole destroy || true
              helmfile --selector name=unbound destroy || true
              helm uninstall -n pihole pihole unbound || true
              clean_ns "pihole"
              ;;

            "metallb")
              echo "🧹 Cleaning MetalLB..."
              helmfile --selector name=metallb destroy || true
              helm uninstall -n metallb-system metallb || true
              clean_ns "metallb-system"
              ;;

            "longhorn")
              echo "🧹 Cleaning Longhorn..."
              helmfile --selector name=longhorn destroy || true
              kubectl -n longhorn-system patch -p '{"metadata":{"finalizers":[]}}' type=merge p pod --all || true
              clean_ns "longhorn-system"
              ;;
            
            "traefik")
               echo "🧹 Cleaning Traefik..."
               helmfile --selector name=traefik destroy || true
               clean_ns "traefik-system"
               ;;
          esac

          echo "🗑️ Pruning Orphaned Resources..."
          kubectl delete pod --field-selector=status.phase==Failed -A || true
          kubectl delete pod --field-selector=status.phase==Succeeded -A || true

          echo "✅ CLEANUP COMPLETED!"
