name: 📦 Deploy Homelab

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '🔎 DRY RUN' || '🚀 APPLY' }} · Deploy (${{ github.ref_name }})

on:
  push:
    tags:
      - "deploy-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show the diff, do not apply"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: homelab-cluster
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Only deploy commits from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: 🔍 Verify Environment
        run: |
          kubectl version --client
          helmfile --version
          sops --version

      - name: 🔎 Diff (dry run)
        if: inputs.dry_run
        run: helmfile diff --suppress-secrets --context 3

      # helmfile apply only upgrades releases that changed. Apps and Traefik
      # use atomic: true in helmfile.yaml, so a failed upgrade rolls back by itself.
      - name: 🚀 Apply
        if: ${{ !inputs.dry_run }}
        run: helmfile apply --suppress-secrets --skip-diff-on-install

      - name: 🔍 Final Health Check
        if: ${{ !inputs.dry_run }}
        run: |
          kubectl get svc -A --field-selector spec.type=LoadBalancer
          for ns in metallb-system longhorn-system traefik-system pihole homebridge tailscale printing; do
            kubectl wait --for=condition=Ready pod --all -n "$ns" \
              --field-selector=status.phase!=Succeeded --timeout=300s
          done
