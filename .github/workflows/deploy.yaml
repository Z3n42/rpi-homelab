name: Deploy Homelab

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted 
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: 🧹 Log Rotation & Cleanup
        run: |
          LOG_DIR="/home/pi/logs"
          mkdir -p $LOG_DIR
          
          echo "--- 🔄 Starting Log Rotation ---"
          
          if [ -f "$LOG_DIR/deploy.log" ]; then
             TIMESTAMP=$(date +%Y%m%d-%H%M%S)
             mv "$LOG_DIR/deploy.log" "$LOG_DIR/archive-deploy-$TIMESTAMP.log"
             echo "Previous log archived: archive-deploy-$TIMESTAMP.log"
          fi
          
          find $LOG_DIR -name "archive-deploy-*.log" -mtime +30 -type f -delete
          echo "Old logs (>30 days) deleted."

      - name: 🔍 Verify Environment
        run: |
          echo "Checking tools..."
          kubectl version --client
          helmfile --version
          sops --version

      - name: 🧹 Pre-deploy Cleanup (Safe)
        run: |
          echo "🔄 Pre-deploy cleanup..."
          kubectl delete crd -l app.kubernetes.io/name=traefik --ignore-not-found=true
          kubectl delete ingressclass traefik --ignore-not-found=true          

      - name: 🔧 Install Traefik CRDs
        run: |
          echo "📦 Installing Traefik CRDs..."
          kubectl apply -f https://github.com/traefik/traefik/releases/download/v3.1.2/traefik-crd.yaml
          kubectl wait --for=condition=Established crd/middlewares.traefik.containo.us --timeout=60s || kubectl wait --for=condition=Established crd/middlewares.traefik.containo.us --timeout=30s
          kubectl get crd | grep traefik | head -5
          echo "✅ CRDs ready"

      - name: 🚀 Deploy with Helmfile
        env:
          PIHOLE_IP: "192.168.1.10"
          HOMEBRIDGE_IP: "192.168.1.14"
          TAILSCALE_IP: "192.168.1.15"
        run: |
          LOGFILE="/home/pi/logs/deploy.log"
          
          {
            echo "========================================================"
            echo "🚀 START DEPLOY: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "Commit: ${{ github.sha }}"
            echo "Message: ${{ github.event.head_commit.message }}"
            echo "--------------------------------------------------------"
          } | tee -a $LOGFILE
          
          set -o pipefail
          
          echo "🎯 PASO 1: Bootstrap MetalLB (CRDs)..." | tee -a $LOGFILE
          helmfile sync --selector name=metallb 2>&1 | tee -a $LOGFILE
          
          echo "✅ MetalLB CRDs instalados. Verificando..." | tee -a $LOGFILE
          kubectl get crd | grep metallb | tee -a $LOGFILE
          
          echo "🎯 PASO 2: Deploy completo (Pi-hole + todo)..." | tee -a $LOGFILE
          helmfile sync 2>&1 | tee -a $LOGFILE
          
          STATUS=$?
          
          echo "--------------------------------------------------------" | tee -a $LOGFILE
          if [ $STATUS -eq 0 ]; then
            echo "✅ SUCCESS: Deployment finished at $(date '+%Y-%m-%d %H:%M:%S')" | tee -a $LOGFILE
            echo "🔍 Verificando Pi-hole DNS IP..." | tee -a $LOGFILE
            kubectl get svc -n pihole | grep LoadBalancer | tee -a $LOGFILE
          else
            echo "❌ FAILED (Exit Code: $STATUS): $(date '+%Y-%m-%d %H:%M:%S')" | tee -a $LOGFILE
            echo "Check log at $LOGFILE for details."
            exit $STATUS
          fi
          echo "========================================================" | tee -a $LOGFILE

      - name: 🔍 Final Health Check
        if: success()
        run: |
          echo "🎯 Health Check:"
          kubectl get svc -n pihole | grep LoadBalancer
          kubectl get ingress -n pihole
          kubectl get pods -n traefik-system -n pihole | grep -E "(Running|Ready)"
          curl -k -H "Host: pihole.home.lan" http://192.168.1.50 || echo "Web test (ignore if TLS)"