name: Deploy Homelab

on:
  push:
    tags:
      - "deploy-*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🧹 Log Rotation & Cleanup
        run: |
          LOG_DIR="/home/pi/logs"
          mkdir -p "$LOG_DIR"

          if [ -f "$LOG_DIR/deploy.log" ]; then
            TS=$(date +%Y%m%d-%H%M%S)
            mv "$LOG_DIR/deploy.log" "$LOG_DIR/archive-deploy-$TS.log"
          fi

          find "$LOG_DIR" -name "archive-deploy-*.log" -mtime +30 -delete

      - name: 🔍 Verify Environment
        run: |
          kubectl version --client
          helmfile --version
          sops --version

      - name: 🚑 Fix Traefik Conflicts
        run: |
          if kubectl get ingressclass traefik -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}' | grep -q "Helm"; then
            NS=$(kubectl get ingressclass traefik -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-namespace}')
            if [ "$NS" = "kube-system" ]; then
              kubectl delete ingressclass traefik --ignore-not-found=true
            fi
          fi

      - name: 🔍 Detect Changed Services
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1)
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)

          SERVICES=()
          for f in $CHANGED; do
            case "$f" in
              manifests/pihole/*|values/pihole*|secrets/pihole*)
                SERVICES+=("pihole-stack")
                ;;
              manifests/homebridge/*|values/homebridge*)
                SERVICES+=("homebridge")
                ;;
              manifests/tailscale/*|values/tailscale*)
                SERVICES+=("tailscale")
                ;;
            esac
          done

          printf "%s\n" "${SERVICES[@]}" | sort -u > /tmp/changed_services.list

      - name: 🚀 Deploy with Helmfile (with rollback safeguard)
        shell: bash
        run: |
          set -euo pipefail

          rollback_if_needed() {
            local RELEASE=$1
            local NS=$2

            PREV=$(helm history "$RELEASE" -n "$NS" | awk 'NR==2{print $1}')
            NEW=$(helm history "$RELEASE" -n "$NS" | awk 'NR==2{print $1}')

            if [ "$NEW" -gt "$PREV" ]; then
              echo "⚠️ Rolling back $RELEASE to revision $PREV"
              helm rollback "$RELEASE" "$PREV" -n "$NS"
            else
              echo "ℹ️ No rollback needed for $RELEASE"
            fi
          }

          LOGFILE="/home/pi/logs/deploy.log"
          mkdir -p "$(dirname "$LOGFILE")"

          echo "🎯 Syncing core networking..."
          helmfile sync --selector name=metallb
          helmfile sync --selector name=longhorn

          FAILED=()

          if [ -s /tmp/changed_services.list ]; then
            for svc in $(cat /tmp/changed_services.list); do
              echo "🎯 Syncing $svc..."
              if ! helmfile sync --selector name="$svc"; then
                FAILED+=("$svc")
              fi
            done
          else
            echo "⚠️ No changed services detected."
          fi

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "❌ Failed services: ${FAILED[*]}"

            for svc in "${FAILED[@]}"; do
              case "$svc" in
                pihole-stack) rollback_if_needed "pihole-stack" "pihole" ;;
                homebridge)   rollback_if_needed "homebridge"   "homebridge" ;;
                tailscale)    rollback_if_needed "tailscale"    "tailscale" ;;
              esac
            done

            exit 1
          fi

          echo "✅ Deployment completed successfully."

      - name: 🔍 Final Health Check
        if: success()
        run: |
          kubectl get svc -A | grep LoadBalancer
          kubectl get pods -A | grep -v "Running\|Completed" || echo "All pods running!"
