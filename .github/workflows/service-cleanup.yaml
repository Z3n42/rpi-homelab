name: 🧹 Service Cleanup (Keep Persistence)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select service to cleanup (PVCs preserved)'
        required: true
        default: 'all'
        type: choice
        options: 
          - 'all'
          - 'pihole'
          - 'homebridge'
          - 'tailscale'
          - 'cups'
          - 'ingresses'
          - 'unbound'
          - 'metallb-config'
      confirm:
        description: 'Type CONFIRM-SERVICE-CLEANUP to proceed'
        required: true
        default: ''

jobs:
  cleanup:
    runs-on: self-hosted

    steps:
      - name: 🚨 SAFETY CHECK
        if: github.event.inputs.confirm != 'CONFIRM-SERVICE-CLEANUP'
        run: |
          echo "❌ ABORTED: You must type CONFIRM-SERVICE-CLEANUP"
          exit 1

      - name: Checkout
        uses: actions/checkout@v3

      - name: 🧹 Cleanup Services (PVCs preserved)
        run: |
          TARGET="${{ github.event.inputs.target }}"
          echo "🧹 SERVICE CLEANUP (PVCs preserved) - Target: $TARGET"

          cleanup_release() {
            RELEASE=$1
            echo "🧹 Destroying Helm release: $RELEASE"
            helmfile destroy --selector name=$RELEASE || true
          }

          cleanup_services() {
            NS=$1
            echo "🧹 Deleting Deployments, Jobs and Services in $NS"
            kubectl delete deploy --all -n $NS --ignore-not-found || true
            kubectl delete job --all -n $NS --ignore-not-found || true

            # Clean Services safely (remove finalizers)
            for svc in $(kubectl get svc -n $NS -o jsonpath='{.items[*].metadata.name}'); do
              echo "🧹 Removing Service: $svc"
              kubectl get svc $svc -n $NS -o json \
                | jq 'del(.metadata.finalizers)' \
                | kubectl replace --raw "/api/v1/namespaces/$NS/services/$svc/finalize" -f - || true
            done
          }

          case "$TARGET" in
            "all")
              cleanup_release "pihole-stack"
              cleanup_release "homebridge"
              cleanup_release "tailscale"
              cleanup_release "cups"
              cleanup_release "traefik-resources" 
              cleanup_services "pihole"
              cleanup_services "homebridge"
              cleanup_services "tailscale"
              cleanup_services "printing"
              cleanup_services "traefik-system"
              ;;
            "pihole")
              cleanup_release "pihole-stack"
              cleanup_services "pihole"
              ;;
            "homebridge")
              cleanup_release "homebridge"
              cleanup_services "homebridge"
              ;;
            "tailscale")
              cleanup_release "tailscale"
              cleanup_services "tailscale"
              ;;
            "cups")
              cleanup_release "cups"
              cleanup_services "printing"
              ;;
            "ingresses")
              cleanup_release "traefik-resources"
              cleanup_services "traefik-system" 
              ;;
            "unbound")
              cleanup_services "pihole"
              ;;
            "metallb-config")
              cleanup_release "metallb-config"
              ;;
          esac

          echo "💾 PVCs preserved:"
          kubectl get pvc -A | grep longhorn || echo "No PVCs found"
          echo "✅ Cleanup complete. Ready for helmfile apply."
