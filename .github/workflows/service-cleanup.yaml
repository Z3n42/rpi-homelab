name: 🧹 Service Cleanup (Keep Persistence)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Services to cleanup (keep Longhorn volumes)'
        required: true
        default: 'all'
        type: choice
        options: 
          - 'all'
          - 'pihole'
          - 'homebridge'
          - 'tailscale'
          - 'unbound'
          - 'metallb-config'

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: 🚨 SAFETY CHECK
        if: github.event.inputs.confirm != 'CONFIRM-SERVICE-CLEANUP'
        run: |
          echo "❌ ABORTED: Type 'CONFIRM-SERVICE-CLEANUP' in confirmation!"
          exit 1

      - name: Check out code
        uses: actions/checkout@v3

      - name: 🧹 Service Cleanup (Keep Persistence)
        run: |
          TARGET: ${{ github.event.inputs.target || 'all' }} 
          echo "🧹 SERVICE CLEANUP - Longhorn volumes PRESERVED"
          
          cleanup_release() {
            RELEASE_NAME=$1
            echo "🧹 Cleaning release: $RELEASE_NAME"
            helmfile destroy --selector name=$RELEASE_NAME || true
          }
          
          cleanup_ns_safe() {
            NS=$1
            if kubectl get ns $NS >/dev/null 2>&1; then
              echo "🧹 Deleting namespace $NS (services only)..."
              kubectl delete deployments,statefulsets,jobs,services,configmaps,secrets,ingresses --all -n $NS || true
            fi
          }

          case "$TARGET" in
            "all")
              echo "🧹 Cleaning ALL services (except Longhorn/PVs)..."
              for release in pihole-stack traefik homebridge tailscale; do
                cleanup_release "$release"
              done
              ;;
              
            "pihole")
              cleanup_release "pihole-stack"
              cleanup_ns_safe "pihole"
              ;;
              
            "homebridge")
              cleanup_release "homebridge"
              cleanup_ns_safe "homebridge"
              ;;
              
            "tailscale")
              cleanup_release "tailscale"
              cleanup_ns_safe "tailscale"
              ;;
              
            "metallb-config")
              cleanup_release "metallb-config"
              ;;
          esac
          
          echo "✅ Services cleaned!"
          echo "💾 Longhorn volumes intactos:"
          kubectl get pvc -A | grep longhorn || echo "No PVCs"
          echo "🔄 Ready for: helmfile apply"
