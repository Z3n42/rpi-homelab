name: 🚀 Safe Homelab Redeploy

run-name: ${{ inputs.dry_run && '🔎 DRY RUN' || '🚀 APPLY' }} · Redeploy ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to redeploy?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'pihole'
          - 'homebridge'
          - 'tailscale'
          - 'cups'
          - 'ingresses'
          - 'networking-only'
      restart:
        description: 'Rolling restart of the target pods after applying'
        type: boolean
        default: true
      dry_run:
        description: 'Only show the diff, do not apply or restart'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: homelab-cluster
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  redeploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔍 Verify Environment
        run: |
          kubectl version --client
          helmfile --version
          sops --version

      - name: 🎯 Resolve target
        id: resolve
        run: |
          case "$TARGET" in
            all)             STACKS="pihole homebridge tailscale cups ingresses"
                             RESTART_NS="pihole homebridge tailscale printing"
                             HEALTH_NS="pihole homebridge tailscale printing traefik-system" ;;
            pihole)          STACKS="pihole";     RESTART_NS="pihole";     HEALTH_NS="pihole" ;;
            homebridge)      STACKS="homebridge"; RESTART_NS="homebridge"; HEALTH_NS="homebridge" ;;
            tailscale)       STACKS="tailscale";  RESTART_NS="tailscale";  HEALTH_NS="tailscale" ;;
            cups)            STACKS="cups";       RESTART_NS="printing";   HEALTH_NS="printing" ;;
            ingresses)       STACKS="ingresses";  RESTART_NS="";           HEALTH_NS="traefik-system" ;;
            networking-only) STACKS="networking"; RESTART_NS="";           HEALTH_NS="metallb-system traefik-system" ;;
            *) echo "Unknown target: $TARGET"; exit 1 ;;
          esac
          {
            echo "stacks=$STACKS"
            echo "restart_ns=$RESTART_NS"
            echo "health_ns=$HEALTH_NS"
          } >> "$GITHUB_OUTPUT"

      - name: 🔎 Diff (dry run)
        if: ${{ inputs.dry_run }}
        env:
          STACKS: ${{ steps.resolve.outputs.stacks }}
        run: |
          SELECTORS=()
          for s in $STACKS; do SELECTORS+=(--selector "stack=$s"); done
          helmfile "${SELECTORS[@]}" diff --suppress-secrets --context 3

      - name: 🚀 Apply
        if: ${{ !inputs.dry_run }}
        env:
          STACKS: ${{ steps.resolve.outputs.stacks }}
        run: |
          SELECTORS=()
          for s in $STACKS; do SELECTORS+=(--selector "stack=$s"); done
          helmfile "${SELECTORS[@]}" apply --suppress-secrets --skip-diff-on-install

      - name: 🔄 Restart workloads
        if: ${{ !inputs.dry_run && inputs.restart && steps.resolve.outputs.restart_ns != '' }}
        env:
          RESTART_NS: ${{ steps.resolve.outputs.restart_ns }}
        run: |
          for ns in $RESTART_NS; do
            resources=$(kubectl get deploy,sts,ds -n "$ns" -o name)
            for res in $resources; do
              echo "🔄 Restarting $res in $ns"
              kubectl rollout restart "$res" -n "$ns"
              if ! kubectl rollout status "$res" -n "$ns" --timeout=600s; then
                echo "❌ Rollout failed for $res in $ns"
                kubectl get pods -n "$ns" -o wide
                for pod in $(kubectl get pods -n "$ns" --no-headers | awk '{split($2,r,"/"); if (r[1]!=r[2]) print $1}'); do
                  echo "📄 Logs: $pod"
                  kubectl logs -n "$ns" "$pod" --all-containers --tail=50 || true
                done
                exit 1
              fi
            done
          done

      - name: 🔍 Health check
        if: ${{ !inputs.dry_run }}
        env:
          HEALTH_NS: ${{ steps.resolve.outputs.health_ns }}
        run: |
          # Job pods (pihole init/seed) finish as Completed and never become Ready,
          # so they are excluded from the Ready wait and checked as Jobs instead.
          for ns in $HEALTH_NS; do
            kubectl wait --for=condition=Ready pod -n "$ns" -l '!job-name' \
              --field-selector='status.phase!=Succeeded,status.phase!=Failed' --timeout=300s
            if [ -n "$(kubectl get job -n "$ns" -o name)" ]; then
              kubectl wait --for=condition=complete job --all -n "$ns" --timeout=300s
            fi
          done
          kubectl get svc -A --field-selector spec.type=LoadBalancer
