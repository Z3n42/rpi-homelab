name: 🚀 Safe Homelab Redeploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to redeploy?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'pihole'
          - 'homebridge'
          - 'tailscale'
          - 'networking-only'

jobs:
  redeploy:
    runs-on: self-hosted

    steps:
      - name: 🧹 Clean workspace (fix stale Helmfile)
        run: git clean -fdx

      - name: Checkout
        uses: actions/checkout@v3

      - name: 🔍 Verify Environment
        run: |
          kubectl version --client
          helmfile --version
          sops --version

      - name: 🚀 Deploy with Helmfile (with rollback safeguard)
        shell: bash
        run: |
          set -euo pipefail

          rollback_if_needed() {
            local RELEASE=$1
            local NS=$2

            PREV=$(helm history "$RELEASE" -n "$NS" | awk 'NR==2{print $1}')
            NEW=$(helm history "$RELEASE" -n "$NS" | awk 'NR==2{print $1}')

            if [ "$NEW" -gt "$PREV" ]; then
              echo "⚠️ Rolling back $RELEASE to revision $PREV"
              helm rollback "$RELEASE" "$PREV" -n "$NS"
            else
              echo "ℹ️ No rollback needed for $RELEASE"
            fi
          }

          TARGET="${{ github.event.inputs.target }}"

          echo "🎯 Syncing core networking..."
          helmfile sync --selector name=metallb
          helmfile sync --selector name=longhorn

          case "$TARGET" in
            all) SERVICES=("pihole-stack" "homebridge" "tailscale") ;;
            pihole) SERVICES=("pihole-stack") ;;
            homebridge) SERVICES=("homebridge") ;;
            tailscale) SERVICES=("tailscale") ;;
            networking-only) SERVICES=() ;;
          esac

          FAILED=()

          for svc in "${SERVICES[@]}"; do
            echo "🎯 Syncing $svc..."
            if ! helmfile sync --selector name="$svc"; then
              FAILED+=("$svc")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "❌ Failed services: ${FAILED[*]}"

            for svc in "${FAILED[@]}"; do
              case "$svc" in
                pihole-stack) rollback_if_needed "pihole-stack" "pihole" ;;
                homebridge)   rollback_if_needed "homebridge"   "homebridge" ;;
                tailscale)    rollback_if_needed "tailscale"    "tailscale" ;;
              esac
            done

            exit 1
          fi

          echo "✅ Redeploy completed successfully."

      - name: 🔄 Restart Deployments (SAFE + diagnostic)
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          safe_restart() {
            local NS=$1
            local DEPLOY=$2

            echo "🔄 Restarting $DEPLOY in $NS"
            kubectl rollout restart "deploy/$DEPLOY" -n "$NS"

            echo "⏳ Waiting for rollout..."
            if ! kubectl rollout status "deploy/$DEPLOY" -n "$NS" --timeout=600s; then
              echo "❌ Rollout failed for $DEPLOY in $NS"

              echo "📄 Deployment describe:"
              kubectl describe deploy "$DEPLOY" -n "$NS" || true

              echo "📄 Pod list:"
              kubectl get pods -n "$NS" -o wide || true

              POD=$(kubectl get pods -n "$NS" -o jsonpath='{.items[0].metadata.name}')
              echo "📄 Logs from pod: $POD"
              kubectl logs -n "$NS" "$POD" --all-containers || true

              exit 1
            fi

            echo "✅ Rollout completed successfully for $DEPLOY"
          }

          TARGET="${{ github.event.inputs.target }}"

          case "$TARGET" in
            all)
              safe_restart "pihole" "pihole-v6"
              safe_restart "homebridge" "homebridge"
              safe_restart "tailscale" "tailscale-operator"
              ;;
            pihole)
              safe_restart "pihole" "pihole-v6"
              ;;
            homebridge)
              safe_restart "homebridge" "homebridge"
              ;;
            tailscale)
              safe_restart "tailscale" "tailscale-operator"
              ;;
            networking-only)
              echo "No restarts needed."
              ;;
          esac
