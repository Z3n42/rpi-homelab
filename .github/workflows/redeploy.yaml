name: 🚀 Safe Homelab Redeploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to redeploy?'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'pihole'
          - 'homebridge'
          - 'tailscale'
          - 'networking-only'

jobs:
  redeploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: 🔍 Verify Environment
        run: |
          kubectl version --client
          helmfile --version
          sops --version

      - name: 🔄 Safe Restart Function
        id: restart-fn
        shell: bash
        run: |
          cat << 'EOF' > /tmp/safe_restart.sh
          #!/bin/bash
          set -e

          safe_restart() {
            NS=$1
            DEPLOY=$2

            echo "🔄 Restarting Deployment $DEPLOY in namespace $NS"
            kubectl rollout restart deploy/$DEPLOY -n $NS
            kubectl rollout status deploy/$DEPLOY -n $NS --timeout=180s
          }
          EOF
          chmod +x /tmp/safe_restart.sh

      - name: 🧹 Pre-clean (SAFE no deletes)
        shell: bash
        run: echo "🧹 No destructive cleanup performed. PVCs, Services, Deployments preserved."

      - name: 🚀 Deploy with Helmfile
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          LOGFILE="/home/pi/logs/deploy.log"
          mkdir -p "$(dirname "$LOGFILE")"

          {
            echo "🚀 SAFE REDEPLOY START: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "Target: $TARGET"
            echo "Commit: ${{ github.sha }}"
            echo "Message: ${{ github.event.head_commit.message }}"
            echo "--------------------------------------------------------"
          } | tee -a $LOGFILE

          set -o pipefail

          echo "🎯 Syncing core networking (MetalLB, Longhorn)..." | tee -a $LOGFILE
          helmfile sync --selector name=metallb 2>&1 | tee -a $LOGFILE
          helmfile sync --selector name=longhorn 2>&1 | tee -a $LOGFILE

          case "$TARGET" in
            "all")
              echo "🎯 Syncing full application stack..." | tee -a $LOGFILE
              helmfile sync 2>&1 | tee -a $LOGFILE
              ;;
            "pihole")
              echo "🎯 Syncing Pi-hole stack only..." | tee -a $LOGFILE
              helmfile sync --selector name=pihole-stack 2>&1 | tee -a $LOGFILE
              ;;
            "homebridge")
              echo "🎯 Syncing Homebridge stack only..." | tee -a $LOGFILE
              helmfile sync --selector name=homebridge 2>&1 | tee -a $LOGFILE
              ;;
            "tailscale")
              echo "🎯 Syncing Tailscale stack only..." | tee -a $LOGFILE
              helmfile sync --selector name=tailscale 2>&1 | tee -a $LOGFILE
              ;;
            "networking-only")
              echo "🎯 Networking-only sync done (MetalLB + Longhorn)." | tee -a $LOGFILE
              ;;
          esac

          STATUS=$?

          echo "--------------------------------------------------------" | tee -a $LOGFILE
          if [ $STATUS -eq 0 ]; then
            echo "✅ SUCCESS: Redeploy finished at $(date '+%Y-%m-%d %H:%M:%S')" | tee -a $LOGFILE
          else
            echo "❌ FAILED (Exit Code: $STATUS)" | tee -a $LOGFILE
            exit $STATUS
          fi
          echo "========================================================" | tee -a $LOGFILE

      - name: 🔄 Restart Deployments (SAFE)
        if: success()
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          source /tmp/safe_restart.sh

          case "$TARGET" in
            "all")
              safe_restart "pihole" "pihole-v6"
              safe_restart "homebridge" "homebridge"
              safe_restart "tailscale" "tailscale-operator"
              ;;
            "pihole")
              safe_restart "pihole" "pihole-v6"
              ;;
            "homebridge")
              safe_restart "homebridge" "homebridge"
              ;;
            "tailscale")
              safe_restart "tailscale" "tailscale-operator"
              ;;
            "networking-only")
              echo "No app restarts for networking-only mode."
              ;;
          esac
