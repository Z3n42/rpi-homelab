repositories:
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: longhorn
    url: https://charts.longhorn.io
  - name: tailscale
    url: https://pkgs.tailscale.com/helmcharts
  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts/
  - name: bedag
    url: https://bedag.github.io/helm-charts
  - name: traefik
    url: https://traefik.github.io/charts

---
environments:
  default:
    values:
      - values/network.yaml
    secrets:
      - secrets/app.sops.yaml

---
releases:

  # -----------------------------
  # METALLB
  # -----------------------------
  - name: metallb
    namespace: metallb-system
    chart: metallb/metallb
    hooks:
      - events: [postsync]
        showlogs: true
        command: "kubectl"
        args: ["wait", "--namespace", "metallb-system", "--for=condition=ready", "pod", "--selector=app.kubernetes.io/name=metallb", "--timeout=90s"]
    values:
      - values/metallb.yaml.gotmpl

  - name: metallb-config
    namespace: metallb-system
    chart: bedag/raw
    needs:
      - metallb-system/metallb
    values:
      - values/metallb-config.yaml.gotmpl

  # -----------------------------
  # LONGHORN
  # -----------------------------
  - name: longhorn
    namespace: longhorn-system
    chart: longhorn/longhorn
    installed: true
    values:
      - values/longhorn.yaml

  # -----------------------------
  # TRAEFIK
  # -----------------------------
  - name: traefik-crds
    namespace: traefik-system
    createNamespace: true
    chart: traefik/traefik
    version: "28.1.0"
    values:
      - installationCRDs: true
      - core:
          enabled: false
      - service:
          enabled: false

  - name: traefik
    namespace: traefik-system
    chart: traefik/traefik
    version: "28.1.0"
    needs:
      - traefik-system/traefik-crds
      - metallb-system/metallb-config
    values:
      - installationCRDs: false
      - deployment:
          annotations:
            redeploy-timestamp: "{{ now }}"
      - api:
          dashboard: true
          insecure: true
      - logs:
          general:
            level: INFO
      - additionalArguments:
          - "--entryPoints.web.address=:8000"
          - "--entryPoints.websecure.address=:8443"
          - "--entryPoints.websecure.http.tls=true"
      - ports:
          web:
            port: 8000
            exposedPort: 80
            protocol: TCP
            expose: true
          websecure:
            port: 8443
            exposedPort: 443
            protocol: TCP
            expose: true
      - service:
          spec:
            type: LoadBalancer
            loadBalancerIP: "{{ .Values.network.services.traefik.ip }}"

  # -----------------------------
  # PIHOLE
  # -----------------------------
  - name: pihole-stack
    namespace: pihole
    chart: bedag/raw
    createNamespace: true
    needs:
      - metallb-system/metallb
      - longhorn-system/longhorn
      - traefik-system/traefik
    values:
      - manifests/pihole/pihole-unbound-v6.yaml.gotmpl

  # -----------------------------
  # HOMEBRIDGE
  # -----------------------------
  - name: homebridge
    namespace: homebridge
    chart: bjw-s/app-template
    createNamespace: true
    needs:
      - metallb-system/metallb
      - longhorn-system/longhorn
    values:
      - controllers:
          main:
            type: deployment
            annotations:
              reloader.stakater.com/auto: "true"
            pod:
              hostNetwork: true
            containers:
              main:
                image:
                  repository: homebridge/homebridge
                  tag: latest
                env:
                  TZ: "Europe/Madrid"
                  PGID: "1000"
                  PUID: "1000"
                  HOMEBRIDGE_CONFIG_UI: "1"
                  HOMEBRIDGE_CONFIG_UI_PORT: "8581"

      - service:
          main:
            controller: main
            type: LoadBalancer
            annotations:
              metallb.universe.tf/address-pool: pihole-pool
              metallb.universe.tf/loadBalancerIPs: "{{ .Values.network.services.homebridge.ip }}"
            ports:
              http:
                port: 8581
              hap:
                port: 51826

      - persistence:
          config:
            enabled: true
            storageClass: "longhorn"
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /homebridge

  # -----------------------------
  # TAILSCALE SECRET
  # -----------------------------
  - name: tailscale-oauth-secret
    namespace: tailscale
    installed: true
    chart: bedag/raw
    createNamespace: true
    values:
      - resources:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: operator-oauth
              namespace: tailscale
            type: Opaque
            stringData:
              client_id: "{{ .Values.tailscale.oauth.clientId }}"
              client_secret: "{{ .Values.tailscale.oauth.clientSecret }}"

  # -----------------------------
  # TAILSCALE AUTH KEY SECRET
  # -----------------------------
  - name: tailscale-auth-secret
    namespace: tailscale
    installed: true
    chart: bedag/raw
    createNamespace: true
    values:
      - resources:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: tailscale-auth
              namespace: tailscale
            type: Opaque
            stringData:
              authkey: "{{ .Values.tailscale.authKey }}"

  # -----------------------------
  # TAILSCALE OPERATOR
  # -----------------------------
  - name: tailscale
    namespace: tailscale
    chart: tailscale/tailscale-operator
    needs:
      - metallb-system/metallb
      - tailscale/tailscale-oauth-secret
    secrets:
      - secrets/app.sops.yaml
    values:
      - operatorConfig:
          logging: "info"
          defaultTags:
            - tag:server
          extraEnv:
            - name: OPERATOR_SECRET
              value: tailscale-auth
      - deployment:
          annotations:
            secret-hash: "{{ .Values.tailscale.oauth | toYaml | sha256sum }}"

  # -----------------------------
  # TRAEFIK RESOURCES
  # -----------------------------
  - name: traefik-resources
    chart: bedag/raw
    namespace: traefik-system
    needs:
      - traefik-system/traefik
    labels:
      domain-version: "{{ .Values.network.domain }}"
    values:
      - resources:
          - {{ tpl (readFile "manifests/traefik/traefik-dashboard.yaml.gotmpl") . | fromYaml | toYaml | indent 12 | trim }}

  # -----------------------------
  # CLEANUP TOOLS
  # -----------------------------
  - name: cleanup-tools
    chart: bedag/raw
    namespace: kube-system
    hooks:
      - events: [presync]
        name: "emergency-cleanup"
        command: "sh"
        args:
          - "-c"
          - |
            echo "🚨 Emergency cleanup available"
            echo "  helmfile destroy --selector name=longhorn"
