repositories:
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: longhorn
    url: https://charts.longhorn.io
  - name: tailscale
    url: https://pkgs.tailscale.com/helmcharts
  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts/
  - name: bedag
    url: https://bedag.github.io/helm-charts
  - name: traefik
    url: https://traefik.github.io/charts

---
environments:
  default:
    values:
      - values/network.yaml
    secrets:
      - secrets/app.sops.yaml

---
releases:

  # -----------------------------
  # METALLB
  # -----------------------------
  - name: metallb
    namespace: metallb-system
    chart: metallb/metallb
    hooks:
      - events: [postsync]
        showlogs: true
        command: "kubectl"
        args: ["wait", "--namespace", "metallb-system", "--for=condition=ready", "pod", "--selector=app.kubernetes.io/name=metallb", "--timeout=90s"]
    values:
      - values/metallb.yaml.gotmpl

  - name: metallb-config
    namespace: metallb-system
    chart: bedag/raw
    needs:
      - metallb-system/metallb
    values:
      - values/metallb-config.yaml.gotmpl

  # -----------------------------
  # LONGHORN
  # -----------------------------
  - name: longhorn
    namespace: longhorn-system
    chart: longhorn/longhorn
    installed: true
    values:
      - values/longhorn.yaml

  # -----------------------------
  # TRAEFIK
  # -----------------------------
  - name: traefik-crds
    namespace: traefik-system
    createNamespace: true
    chart: traefik/traefik
    version: "28.1.0"
    values:
      - installationCRDs: true
      - core:
          enabled: false
      - service:
          enabled: false

  - name: traefik
    namespace: traefik-system
    chart: traefik/traefik
    version: "28.1.0"
    needs:
      - traefik-system/traefik-crds
      - metallb-system/metallb-config
    secrets:
      - secrets/app.sops.yaml
    values:
      - installationCRDs: false
      - deployment:
          annotations:
            redeploy-timestamp: "{{ now }}"
      - api:
          dashboard: true
      - logs:
          general:
            level: INFO
      - additionalArguments:
          - "--entryPoints.web.address=:8000"
          - "--entryPoints.websecure.address=:8443"
          - "--entryPoints.websecure.http.tls=true"
          - "--certificatesResolvers.le.acme.email={{ .Values.traefik.email }}" 
          - "--certificatesResolvers.le.acme.httpChallenge.entryPoint=web"
          - "--certificatesResolvers.le.acme.storage=/data/acme.json"
      - ports:
          web:
            port: 8000
            exposedPort: 80
            protocol: TCP
            expose:
              default: true
          websecure:
            port: 8443
            exposedPort: 443
            protocol: TCP
            expose:
              default: true
      - service:
          spec:
            type: LoadBalancer
            loadBalancerIP: "{{ .Values.network.services.traefik.ip }}"
      
      - persistence:
          data:
            enabled: true
            storageClass: "longhorn" 
            size: 1Gi
            accessMode: ReadWriteOnce
            mountPath: /data

  # -----------------------------
  # PIHOLE
  # -----------------------------
  - name: pihole-stack
    namespace: pihole
    chart: bedag/raw
    createNamespace: true
    needs:
      - metallb-system/metallb
      - longhorn-system/longhorn
      - traefik-system/traefik
    values:
      - manifests/pihole/pihole-unbound-v6.yaml.gotmpl

  # -----------------------------
  # HOMEBRIDGE
  # -----------------------------
  - name: homebridge
    namespace: homebridge
    labels:
      name: homebridge
    chart: bjw-s/app-template
    createNamespace: true
    needs:
      - metallb-system/metallb
      - longhorn-system/longhorn
    values:
      - controllers:
          main:
            type: deployment
            annotations:
              reloader.stakater.com/auto: "true"
            pod:
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
              annotations:
                rollout-timestamp: "{{ now | unixEpoch }}"
            containers:
              main:
                image:
                  repository: homebridge/homebridge
                  tag: "ubuntu"
                securityContext:
                  capabilities:
                    add:
                      - NET_RAW
                      - NET_ADMIN
                env:
                  TZ: "Europe/Madrid"
                  PGID: "1000"
                  PUID: "1000"
                  HOMEBRIDGE_CONFIG_UI: "1"
                  HOMEBRIDGE_CONFIG_UI_PORT: "8581"
                  AVAHI: "1"

      - service:
          main:
            controller: main
            type: LoadBalancer
            annotations:
              metallb.universe.tf/address-pool: pihole-pool
              metallb.universe.tf/loadBalancerIPs: "{{ .Values.network.services.homebridge.ip }}"
            ports:
              http:
                port: 8581

      - persistence:
          config:
            enabled: true
            storageClass: "longhorn"
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /homebridge

  # -----------------------------
  # TAILSCALE OAUTH SECRET
  # -----------------------------
  - name: tailscale-oauth-secret
    namespace: tailscale
    installed: true
    chart: bedag/raw
    createNamespace: true
    values:
      - resources:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: operator-oauth
              namespace: tailscale
            type: Opaque
            stringData:
              client_id: "{{ .Values.tailscale.oauth.clientId }}"
              client_secret: "{{ .Values.tailscale.oauth.clientSecret }}"

  # -----------------------------
  # TAILSCALE OPERATOR
  # -----------------------------
  - name: tailscale
    namespace: tailscale
    chart: tailscale/tailscale-operator
    needs:
      - metallb-system/metallb
      - tailscale/tailscale-oauth-secret
    secrets:
      - secrets/app.sops.yaml
    values:
      - operatorConfig:
          logging: "info"
      - deployment:
          annotations:
            secret-hash-oauth: "{{ .Values.tailscale.oauth | toYaml | sha256sum }}"

  # -----------------------------
  # TAILSCALE SUBNET ROUTER
  # -----------------------------
  - name: tailscale-subnet-router
    namespace: tailscale
    installed: true
    chart: bedag/raw
    needs:
      - tailscale/tailscale
    values:
      - resources:
          - {{ (tpl (readFile "manifests/tailscale/tailscale-subnet-router.yaml.gotmpl") .) | fromYaml }}

  # -----------------------------
  # TRAEFIK RESOURCES
  # -----------------------------
  - name: traefik-resources
    chart: bedag/raw
    namespace: traefik-system
    needs:
      - traefik-system/traefik
      - printing/cups
      - homebridge/homebridge
    values:
      - resources:
          - {{ (tpl (readFile "manifests/ingresses/traefik-dashboard.yaml.gotmpl") .) | fromYaml }}
          - {{ (tpl (readFile "manifests/ingresses/cups-ingress.yaml.gotmpl") .) | fromYaml }}
          - {{ (tpl (readFile "manifests/ingresses/homebridge-ingress.yaml.gotmpl") .) | fromYaml }}

  # -----------------------------
  # CLEANUP TOOLS
  # -----------------------------
  - name: cleanup-tools
    chart: bedag/raw
    namespace: kube-system
    hooks:
      - events: [presync]
        name: "emergency-cleanup"
        command: "sh"
        args:
          - "-c"
          - |
            echo "🚨 Emergency cleanup available"
            echo "  helmfile destroy --selector name=longhorn"


  # -----------------------------
  # CUPS 
  # -----------------------------
  - name: cups
    namespace: printing
    chart: bjw-s/app-template
    createNamespace: true
    needs:
      - longhorn-system/longhorn
      - metallb-system/metallb-config
    secrets:
      - secrets/app.sops.yaml
    values:
      - controllers:
          main:
            type: deployment
            annotations:
              reloader.stakater.com/auto: "true"

            initContainers:
              init-cups-config:
                image:
                  repository: mwatz/cups
                  tag: latest
                command:
                  - sh
                  - -c
                  - |
                    echo "🔧 Checking CUPS config PVC..."
                    if [ -z "$(ls -A /config)" ]; then
                      echo "📁 PVC empty, initializing with default CUPS config"
                      cp -r /etc/cups/* /config/
                      # parchea cupsd.conf en /config para escuchar en 0.0.0.0
                      sed -i 's/^Listen localhost:631/Listen 0.0.0.0:631/' /config/cupsd.conf || true
                    else
                      echo "✔ PVC already initialized"
                      sed -i 's/^Listen localhost:631/Listen 0.0.0.0:631/' /config/cupsd.conf || true
                    fi

            pod:
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
              containers:
                - name: main
                  image:
                    repository: mwatz/cups
                    tag: latest
                  securityContext:
                    privileged: true
                  env:
                    TZ: "Europe/Madrid"
                    CUPS_ADMIN_USER: "{{ .Values.cups.user }}"
                    CUPS_ADMIN_PASSWORD: "{{ .Values.cups.password }}"
                  volumeMounts:
                    - name: cups-conf
                      mountPath: /etc/cups/cupsd.conf
                      subPath: cupsd.conf
              volumes:
                - name: cups-conf
                  configMap:
                    name: cups-config

      - service:
          main:
            controller: main
            type: LoadBalancer
            annotations:
              metallb.universe.tf/address-pool: default-pool
              metallb.universe.tf/loadBalancerIPs: "{{ .Values.network.services.cups.ip }}"
            ports:
              http:
                port: 631

      - persistence:
          cups:
            enabled: true
            storageClass: "longhorn"
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /config
          usb:
            enabled: true
            type: hostPath
            hostPath: /dev/bus/usb
            globalMounts:
              - path: /dev/bus/usb
