repositories:
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: longhorn
    url: https://charts.longhorn.io
  - name: mojo2600
    url: https://mojo2600.github.io/pihole-kubernetes/
  - name: tailscale
    url: https://pkgs.tailscale.com/helmcharts
  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts/
  - name: bedag
    url: https://bedag.github.io/helm-charts

environments:
  default:
    values:
      - values/network.yaml

releases:
  - name: metallb
    namespace: metallb-system
    chart: metallb/metallb
    hooks:
      - events: [postsync]
        showlogs: true
        command: "kubectl"
        args: ["wait", "--namespace", "metallb-system", "--for=condition=ready", "pod", "--selector=app.kubernetes.io/name=metallb", "--timeout=90s"]
    values: [values/metallb.yaml.gotmpl]

  - name: metallb-config
    namespace: metallb-system
    chart: bedag/raw
    needs: [metallb-system/metallb]
    values:
      - values/metallb-config.yaml.gotmpl

  - name: longhorn
    namespace: longhorn-system
    chart: longhorn/longhorn
    values: [values/longhorn.yaml]

  - name: unbound
    namespace: pihole
    chart: bjw-s/app-template
    needs: [metallb-system/metallb]
    values:
      - controllers:
          main:
            replicas: 1
            containers:
              main:
                image:
                  repository: klutchell/unbound
                  tag: latest
                env:
                  TZ: Europe/Madrid
                ports:
                  - name: dns
                    containerPort: 5335
                    protocol: UDP
                  - name: dns-tcp
                    containerPort: 5335
                    protocol: TCP
      - service:
          main:
            type: ClusterIP
            ports:
              dns:
                port: 5335
                protocol: UDP
              dns-tcp:
                port: 5335
                protocol: TCP

  - name: pihole
    namespace: pihole
    chart: mojo2600/pihole
    needs: 
      - metallb-system/metallb
      - longhorn-system/longhorn
      - pihole/unbound
    secrets:
      - secrets/app.sops.yaml
    values:
      - values/pihole.yaml.gotmpl  # Solo probes, persistence, etc. SIN services
    hooks:
      - events: [postsync]
        name: "pihole-repair-gravity"
        showlogs: true
        command: "kubectl"
        args:
          - "exec"
          - "-n"
          - "pihole"
          - "deployment/pihole"
          - "--"
          - "bash"
          - "-c"
          - |
            echo "🔧 Repairing Pi-hole gravity database..."
            pihole -g && pihole restartdns && echo "✅ Gravity repair complete!"
      - events: [postsync]
        name: "pihole-healthcheck"
        showlogs: true
        command: "kubectl"
        args:
          - "wait"
          - "-n"
          - "pihole"
          - "--for=condition=Available"
          - "deployment/pihole"
          - "--timeout=120s"
      - events: [postsync]
        name: "pihole-config-upstreams"
        showlogs: true
        command: "kubectl"
        args:
          - "exec"
          - "-n"
          - "pihole"
          - "deployment/pihole"
          - "--"
          - "pihole"
          - "-a"
          - "-c"
          - |
            sqlite3 /etc/pihole/gravity.db "DELETE FROM config WHERE property='dns_upstreams';"
            sqlite3 /etc/pihole/gravity.db "INSERT INTO config (property, value) VALUES ('dns_upstreams', 'unbound-main.pihole.svc.cluster.local#5335');"
            pihole restartdns
            echo "✅ Upstream DNS configurado permanentemente"

  - name: pihole-services-lb
    namespace: pihole
    chart: bedag/raw
    needs: [pihole/pihole]
    values:
      - resources:
          - apiVersion: v1
            kind: Service
            metadata:
              name: pihole-dns-tcp
            spec:
              type: LoadBalancer
              loadBalancerIP: {{ .Values.network.services.pihole.primary_ip }}
              externalTrafficPolicy: Local
              selector:
                app.kubernetes.io/name: pihole
              ports:
              - name: dns-tcp
                port: 53
                targetPort: 53
                protocol: TCP
          - apiVersion: v1
            kind: Service
            metadata:
              name: pihole-dns-udp
            spec:
              type: LoadBalancer
              loadBalancerIP: {{ .Values.network.services.pihole.primary_ip }}
              externalTrafficPolicy: Local
              selector:
                app.kubernetes.io/name: pihole
              ports:
              - name: dns-udp
                port: 53
                targetPort: 53
                protocol: UDP
          - apiVersion: v1
            kind: Service
            metadata:
              name: pihole-web
            spec:
              type: LoadBalancer
              loadBalancerIP: {{ .Values.network.services.pihole.primary_ip }}
              externalTrafficPolicy: Local
              selector:
                app.kubernetes.io/name: pihole
              ports:
              - name: http
                port: 80
                targetPort: 80
                protocol: TCP
              - name: https
                port: 443
                targetPort: 443
                protocol: TCP

  - name: pihole-dns-backup
    namespace: pihole
    chart: bedag/raw
    needs: [pihole/pihole]
    values:
      - resources:
          - apiVersion: v1
            kind: Service
            metadata:
              name: pihole-dns-backup
            spec:
              type: LoadBalancer
              loadBalancerIP: {{ .Values.network.services.pihole.backup_ip }}
              selector:
                app.kubernetes.io/name: pihole
                app.kubernetes.io/instance: pihole
              ports:
              - name: dns-tcp-backup
                port: 53
                targetPort: 53
                protocol: TCP
              - name: dns-udp-backup
                port: 53
                targetPort: 53
                protocol: UDP

  - name: homebridge
    namespace: homebridge
    chart: bjw-s/app-template
    needs: 
      - metallb-system/metallb
      - longhorn-system/longhorn
    createNamespace: true
    values:
      - controllers:
          main:
            pod:
              hostNetwork: true
            containers:
              main:
                image:
                  repository: homebridge/homebridge
                  tag: latest
                env:
                  TZ: "Europe/Madrid"
                  PGID: "1000"
                  PUID: "1000"
      - service:
          main:
            controller: main
            ports:
              http:
                port: 8581
      - persistence:
          config:
            enabled: true
            storageClass: "longhorn"
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /homebridge

  - name: tailscale
    namespace: tailscale
    chart: tailscale/tailscale-operator
    needs: [metallb-system/metallb]
    secrets:
      - secrets/app.sops.yaml
    values:
      - operatorConfig:
          logging: "info"
          defaultTags:
            - tag:server

  - name: cleanup-tools
    chart: bedag/raw
    namespace: kube-system
    hooks:
      - events: [presync]
        name: "emergency-cleanup"
        command: "sh"
        args:
          - "-c"
          - |
            echo "🚨 Emergency cleanup available"
            echo "  helmfile destroy --selector name=longhorn"
            echo "  helmfile destroy --selector name=metallb"
