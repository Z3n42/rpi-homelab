repositories:
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: longhorn
    url: https://charts.longhorn.io
  - name: tailscale
    url: https://pkgs.tailscale.com/helmcharts
  - name: bjw-s
    url: https://bjw-s-labs.github.io/helm-charts/
  - name: dysnix
    url: https://dysnix.github.io/charts/
  - name: bedag
    url: https://bedag.github.io/helm-charts
  - name: traefik
    url: https://traefik.github.io/charts

---
environments:
  default:
    values:
      - values/network.yaml
    secrets:
      - secrets/app.sops.yaml

---
releases:

  # -----------------------------
  # METALLB
  # -----------------------------
  - name: metallb
    namespace: metallb-system
    chart: metallb/metallb
    hooks:
      - events: [postsync]
        showlogs: true
        command: "kubectl"
        args: ["wait", "--namespace", "metallb-system", "--for=condition=ready", "pod", "--selector=app.kubernetes.io/name=metallb", "--timeout=90s"]
    values:
      - values/metallb.yaml.gotmpl

  - name: metallb-config
    namespace: metallb-system
    chart: bedag/raw
    needs:
      - metallb-system/metallb
    values:
      - values/metallb-config.yaml.gotmpl

  # -----------------------------
  # LONGHORN
  # -----------------------------
  - name: longhorn
    namespace: longhorn-system
    chart: longhorn/longhorn
    version: "1.11.0"
    installed: true
    hooks:
      - events: [preuninstall]
        showlogs: true
        command: "kubectl"
        args:
          - "annotate"
          - "node"
          - "zenpi"
          - "node.longhorn.io/drain-policy=block-if-contains-last-replica"
          - "--overwrite"
      - events: [postsync]
        showlogs: true
        command: "kubectl"
        args:
          - "wait"
          - "--namespace"
          - "longhorn-system"
          - "--for=condition=ready"
          - "pod"
          - "--selector=app=longhorn-manager"
          - "--timeout=300s"
      - events: [postsync]
        showlogs: true
        command: "kubectl"
        args:
          - "wait"
          - "--namespace"
          - "longhorn-system"
          - "--for=condition=ready"
          - "pod"
          - "--selector=app=longhorn-csi-plugin"
          - "--timeout=300s"
    values:
      - values/longhorn.yaml

  # -----------------------------
  # TRAEFIK
  # -----------------------------
  - name: traefik-crds
    namespace: traefik-system
    createNamespace: true
    chart: traefik/traefik
    version: "28.1.0"
    values:
      - installationCRDs: true
      - core:
          enabled: false
      - service:
          enabled: false

  - name: traefik
    namespace: traefik-system
    chart: traefik/traefik
    version: "28.1.0"
    needs:
      - traefik-system/traefik-crds
      - metallb-system/metallb-config
      - longhorn-system/longhorn
    secrets:
      - secrets/app.sops.yaml
    values:
      - installationCRDs: false
      - deployment:
          annotations:
            redeploy-timestamp: "{{ now }}"
      - api:
          dashboard: true
      - logs:
          general:
            level: INFO
      - additionalArguments:
          - "--entryPoints.web.address=:8000"
          - "--entryPoints.websecure.address=:8443"
          - "--entryPoints.websecure.http.tls=true"
          - "--entryPoints.cups.address=:631"
      - ports:
          web:
            port: 8000
            exposedPort: 80
            protocol: TCP
            expose:
              default: true
          websecure:
            port: 8443
            exposedPort: 443
            protocol: TCP
            expose:
              default: true
          cups:
            port: 631
            protocol: TCP
            expose:
              default: false
      - service:
          spec:
            type: LoadBalancer
            loadBalancerIP: "{{ .Values.network.services.traefik.ip }}"
          ports:
            cups:
              port: 631
      - persistence:
          data:
            enabled: true
            storageClass: "longhorn"
            size: 1Gi
            accessMode: ReadWriteOnce
            mountPath: /data

  # -----------------------------
  # PIHOLE
  # -----------------------------
  - name: pihole-stack
    namespace: pihole
    chart: bedag/raw
    createNamespace: true
    needs:
      - metallb-system/metallb
      - longhorn-system/longhorn
      - traefik-system/traefik
    values:
      - manifests/pihole/pihole-unbound-v6.yaml.gotmpl

  # -----------------------------
  # HOMEBRIDGE
  # -----------------------------
  - name: homebridge
    namespace: homebridge
    labels:
      name: homebridge
    chart: bjw-s/app-template
    createNamespace: true
    needs:
      - metallb-system/metallb
      - longhorn-system/longhorn
    values:
      - controllers:
          main:
            type: deployment
            annotations:
              reloader.stakater.com/auto: "true"
            pod:
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
              annotations:
                rollout-timestamp: "{{ now | unixEpoch }}"
            containers:
              main:
                image:
                  repository: homebridge/homebridge
                  tag: "ubuntu"
                securityContext:
                  capabilities:
                    add:
                      - NET_RAW
                      - NET_ADMIN
                env:
                  TZ: "Europe/Madrid"
                  PGID: "1000"
                  PUID: "1000"
                  HOMEBRIDGE_CONFIG_UI: "1"
                  HOMEBRIDGE_CONFIG_UI_PORT: "8581"
                  AVAHI: "0"
      - service:
          main:
            controller: main
            type: LoadBalancer
            annotations:
              metallb.universe.tf/address-pool: pihole-pool
              metallb.universe.tf/loadBalancerIPs: "{{ .Values.network.services.homebridge.ip }}"
            ports:
              http:
                port: 8581
      - persistence:
          config:
            enabled: true
            storageClass: "longhorn"
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /homebridge

  # -----------------------------
  # TAILSCALE OAUTH SECRET
  # -----------------------------
  - name: tailscale-oauth-secret
    namespace: tailscale
    installed: true
    chart: bedag/raw
    createNamespace: true
    values:
      - resources:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: operator-oauth
              namespace: tailscale
            type: Opaque
            stringData:
              client_id: "{{ .Values.tailscale.oauth.clientId }}"
              client_secret: "{{ .Values.tailscale.oauth.clientSecret }}"

  # -----------------------------
  # TAILSCALE OPERATOR
  # -----------------------------
  - name: tailscale
    namespace: tailscale
    chart: tailscale/tailscale-operator
    needs:
      - metallb-system/metallb
      - tailscale/tailscale-oauth-secret
    secrets:
      - secrets/app.sops.yaml
    values:
      - operatorConfig:
          logging: "info"
      - deployment:
          annotations:
            secret-hash-oauth: "{{ .Values.tailscale.oauth | toYaml | sha256sum }}"

  # -----------------------------
  # TAILSCALE SUBNET ROUTER
  # -----------------------------
  - name: tailscale-subnet-router
    namespace: tailscale
    installed: true
    chart: bedag/raw
    needs:
      - tailscale/tailscale
    values:
      - resources:
          - {{ tpl (readFile "manifests/tailscale/tailscale-subnet-router.yaml.gotmpl") . | indent 12 | trim }}

  # -----------------------------
  # TRAEFIK RESOURCES
  # -----------------------------
  - name: traefik-resources
    chart: bedag/raw
    namespace: traefik-system
    needs:
      - traefik-system/traefik
      - printing/cups
      - homebridge/homebridge
    values:
      - resources:
          - {{ tpl (readFile "manifests/ingresses/traefik-dashboard.yaml.gotmpl") . | indent 12 | trim }}
          - {{ tpl (readFile "manifests/ingresses/cups-ingress.yaml.gotmpl") . | indent 12 | trim }}
          - {{ tpl (readFile "manifests/ingresses/cups-ingress-tcp.yaml.gotmpl") . | indent 12 | trim }}
          - {{ tpl (readFile "manifests/ingresses/homebridge-ingress.yaml.gotmpl") . | indent 12 | trim }}

  # -----------------------------
  # CLEANUP TOOLS
  # -----------------------------
  - name: cleanup-tools
    chart: bedag/raw
    namespace: kube-system
    hooks:
      - events: [presync]
        name: "emergency-cleanup"
        command: "sh"
        args:
          - "-c"
          - |
            echo "🚨 Emergency cleanup available"
            echo "  helmfile destroy --selector name=longhorn"

  # -----------------------------
  # CUPS ConfigMap
  # -----------------------------
  - name: cups-config
    namespace: printing
    chart: dysnix/raw
    version: 0.3.2
    createNamespace: true
    values:
      - resources:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: cups-config
              namespace: printing
            data:
              cupsd.conf: |-
                Listen 0.0.0.0:631
                ServerAlias *
                WebInterface Yes
                LogLevel warn
                MaxLogSize 0

                DefaultAuthType Basic
                DefaultEncryption Never

                <Location />
                  Order allow,deny
                  Allow from all
                </Location>

                <Location /admin>
                  Order allow,deny
                  Allow from all
                </Location>

                <Location /admin/conf>
                  AuthType Default
                  Require user @SYSTEM
                  Order allow,deny
                  Allow from all
                </Location>

                Browsing On
                BrowseLocalProtocols dnssd
                DefaultShared Yes

  # -----------------------------
  # CUPS
  # -----------------------------
  - name: cups
    namespace: printing
    chart: bjw-s/app-template
    createNamespace: true
    needs:
      - printing/cups-config
      - longhorn-system/longhorn
      - metallb-system/metallb-config
    secrets:
      - secrets/app.sops.yaml
    values:
      - controllers:
          main:
            type: deployment
            annotations:
              reloader.stakater.com/auto: "true"
            initContainers:
              init-cups-config:
                image:
                  repository: busybox
                  tag: latest
                command:
                  - sh
                  - -c
                  - |
                    echo "🔧 init: Copying CUPS config from ConfigMap"
                    mkdir -p /etc/cups
                    cp /tmp/cupsd.conf /etc/cups/cupsd.conf
                    echo "✅ Config copied"
                    ls -la /etc/cups/
              init-cups-user:
                image:
                  repository: mwatz/cups
                  tag: latest
                env:
                  - name: CUPS_ADMIN_USER
                    value: "{{ .Values.cups.user }}"
                  - name: CUPS_ADMIN_PASSWORD
                    value: "{{ .Values.cups.password }}"
                command:
                  - sh
                  - -c
                  - |
                    echo "👤 init: Creating CUPS admin user: ${CUPS_ADMIN_USER}"

                    if ! grep -q "^${CUPS_ADMIN_USER}:" /etc/passwd; then
                      adduser --disabled-password ${CUPS_ADMIN_USER}
                      echo "${CUPS_ADMIN_USER}:${CUPS_ADMIN_PASSWORD}" | chpasswd
                      echo "✅ User ${CUPS_ADMIN_USER} created"
                    else
                      echo "ℹ️  User ${CUPS_ADMIN_USER} already exists"
                    fi

                    addgroup lpadmin 2>/dev/null || echo "ℹ️  Group lpadmin already exists"
                    addgroup sys 2>/dev/null || echo "ℹ️  Group sys already exists"
                    
                    adduser ${CUPS_ADMIN_USER} lpadmin 2>/dev/null || echo "ℹ️  User already in lpadmin"
                    adduser ${CUPS_ADMIN_USER} sys 2>/dev/null || echo "ℹ️  User already in sys"

                    echo "📋 Copying user files to shared volume..."
                    cp /etc/passwd /shared-etc/passwd
                    cp /etc/shadow /shared-etc/shadow
                    cp /etc/group /shared-etc/group

                    id ${CUPS_ADMIN_USER}
                    echo "✅ CUPS admin user configured"
              init-printer-firmware:
                image:
                  repository: mwatz/cups
                  tag: latest
                securityContext:
                  privileged: true
                command:
                  - sh
                  - -c
                  - |
                    echo "🖨️  Loading HP P1005 firmware..."
                    DEV=$(grep -rl "03f0" /sys/bus/usb/devices/*/idVendor 2>/dev/null | head -1 || true)
                    if [ -z "$DEV" ]; then
                      echo "⚠️  HP P1005 not found on USB bus, skipping"
                      exit 0
                    fi
                    DEVDIR=$(dirname "$DEV")
                    BUSNUM=$(printf "%03d" "$(cat "$DEVDIR/busnum")")
                    DEVNUM=$(printf "%03d" "$(cat "$DEVDIR/devnum")")
                    echo "Loading firmware to /dev/bus/usb/$BUSNUM/$DEVNUM"
                    foo2zjs-loadfw HP1005 /dev/bus/usb/$BUSNUM/$DEVNUM \
                      < /usr/share/foo2zjs/firmware/sihp1005.dl \
                      && echo "✅ Firmware loaded OK" \
                      || echo "⚠️  Firmware load failed (printer may need replug)"
                volumeMounts:
                  - name: usb
                    mountPath: /dev/bus/usb
            pod:
              dnsPolicy: ClusterFirst
            containers:
              main:
                image:
                  repository: mwatz/cups
                  tag: latest
                securityContext:
                  privileged: true
                env:
                  TZ: "Europe/Madrid"
                  CUPS_ADMIN_USER: "{{ .Values.cups.user }}"
                  CUPS_ADMIN_PASSWORD: "{{ .Values.cups.password }}"
                command:
                  - sh
                  - -c
                  - |
                    echo "🔄 Restoring user files from shared volume..."

                    if [ -f /shared-etc/passwd ]; then
                      cp /shared-etc/passwd /etc/passwd
                      cp /shared-etc/shadow /etc/shadow
                      cp /shared-etc/group /etc/group
                      echo "✅ User files restored"
                      id admin || echo "⚠️  User admin not found"
                    fi

                    echo "✅ Starting CUPS..."
                    exec cupsd -f
      - service:
          main:
            controller: main
            type: LoadBalancer
            annotations:
              metallb.universe.tf/address-pool: pihole-pool
              metallb.universe.tf/loadBalancerIPs: "{{ .Values.network.services.cups.ip }}"
            ports:
              http:
                port: 631
      - persistence:
          config-template:
            enabled: true
            type: configMap
            name: cups-config
            advancedMounts:
              main:
                init-cups-config:
                  - path: /tmp/cupsd.conf
                    subPath: cupsd.conf
                    readOnly: true
          shared-etc:
            enabled: true
            type: emptyDir
            globalMounts:
              - path: /shared-etc
          cups:
            enabled: true
            storageClass: "longhorn"
            accessMode: ReadWriteOnce
            size: 1Gi
            globalMounts:
              - path: /etc/cups
          usb:
            enabled: true
            type: hostPath
            hostPath: /dev/bus/usb
            globalMounts:
              - path: /dev/bus/usb

  # -----------------------------
  # CUPS Avahi Service ConfigMap
  # -----------------------------
  - name: cups-avahi-service
    namespace: printing
    chart: dysnix/raw
    version: 0.3.2
    createNamespace: true
    values:
      - resources:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: cups-avahi-service
              namespace: printing
            data:
              AirPrint-HP_LaserJet_P1005.service: |-
                <?xml version="1.0" standalone='no'?>
                <!DOCTYPE service-group SYSTEM "avahi-service.dtd">
                <service-group>
                  <name replace-wildcards="yes">HP LaserJet P1005</name>
                  <service>
                    <type>_ipp._tcp</type>
                    <subtype>_universal._sub._ipp._tcp</subtype>
                    <subtype>_print._sub._ipp._tcp</subtype>
                    <port>631</port>
                    <txt-record>txtver=1</txt-record>
                    <txt-record>qtotal=1</txt-record>
                    <txt-record>rp=printers/HP_LaserJet_P1005</txt-record>
                    <txt-record>ty=HP LaserJet P1005 Foomatic/foo2xqx</txt-record>
                    <txt-record>adminurl=http://{{ .Values.network.services.cups.ip }}:631/</txt-record>
                    <txt-record>note=HP LaserJet P1005</txt-record>
                    <txt-record>priority=50</txt-record>
                    <txt-record>product=(GPL Ghostscript)</txt-record>
                    <txt-record>pdl=application/pdf,application/postscript,application/vnd.cups-postscript,image/jpeg,image/png,image/pwg-raster</txt-record>
                    <txt-record>URF=W8,SRGB24,CP1,RS600</txt-record>
                    <txt-record>printer-state=3</txt-record>
                    <txt-record>printer-type=0x901046</txt-record>
                    <txt-record>Transparent=T</txt-record>
                    <txt-record>Binary=T</txt-record>
                    <txt-record>Fax=F</txt-record>
                    <txt-record>Color=F</txt-record>
                    <txt-record>Duplex=F</txt-record>
                    <txt-record>Staple=F</txt-record>
                    <txt-record>Copies=T</txt-record>
                    <txt-record>Collate=F</txt-record>
                    <txt-record>Punch=F</txt-record>
                    <txt-record>Bind=F</txt-record>
                    <txt-record>Sort=T</txt-record>
                    <txt-record>Scan=F</txt-record>
                    <txt-record>PaperMax=legal-A4</txt-record>
                  </service>
                </service-group>

  # -----------------------------
  # CUPS Avahi mDNS Publisher
  # -----------------------------
  - name: cups-avahi
    namespace: printing
    chart: bjw-s/app-template
    createNamespace: true
    needs:
      - printing/cups
      - printing/cups-avahi-service
    secrets:
      - secrets/app.sops.yaml
    values:
      - controllers:
          main:
            type: daemonset
            pod:
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
            containers:
              main:
                image:
                  repository: alpine
                  tag: latest
                securityContext:
                  capabilities:
                    add:
                      - NET_ADMIN
                      - NET_RAW
                env:
                  - name: CUPS_SERVICE
                    value: "cups.printing.svc.cluster.local"
                  - name: CUPS_IP
                    value: "{{ .Values.network.services.cups.ip }}"
                command:
                  - sh
                  - -c
                  - |
                    echo "🔧 Installing Avahi and D-Bus..."
                    apk add --no-cache avahi avahi-tools dbus

                    echo "🔧 Configuring D-Bus..."
                    mkdir -p /var/run/dbus /var/lib/dbus
                    dbus-uuidgen > /var/lib/dbus/machine-id
                    dbus-daemon --system --fork

                    if ! pgrep -x dbus-daemon > /dev/null; then
                      echo "❌ D-Bus failed to start"
                      exit 1
                    fi
                    echo "✅ D-Bus started successfully"

                    echo "🔧 Configuring Avahi..."
                    cat > /etc/avahi/avahi-daemon.conf <<EOF
                    [server]
                    use-ipv4=yes
                    use-ipv6=no
                    allow-interfaces=eth0,wlan0
                    enable-dbus=yes

                    [publish]
                    publish-addresses=yes
                    publish-hinfo=yes
                    publish-workstation=no
                    publish-domain=yes

                    [reflector]
                    enable-reflector=yes
                    reflect-ipv=yes
                    EOF

                    echo "✅ AirPrint service files mounted from ConfigMap"
                    ls -lh /etc/avahi/services/

                    echo "✅ Starting Avahi daemon for mDNS broadcasting..."
                    exec avahi-daemon --no-chroot --debug
      
      - persistence:
          avahi-services:
            enabled: true
            type: configMap
            name: cups-avahi-service
            globalMounts:
              - path: /etc/avahi/services
                readOnly: true
